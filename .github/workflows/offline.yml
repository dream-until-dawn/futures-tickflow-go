name: Offline verification
on:
  push:
    branches: [main, codex/offline-readiness-six, codex/historical-dataflow, codex/historical-session-evidence, codex/native-http-feasibility, codex/delivery-refresh-20261113, codex/calendar-continue-20261113, codex/px-sh-holiday-20261113, codex/ine-history-20261113, codex/ine-2026-20261113, codex/ine-2022-20261113, codex/ine-2023-2024-20261113, codex/lu-2020-20261113, codex/gfex-english-home-20261114, codex/offline-delivery-20261114, codex/v4-acceptance-20261114]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.23.x'
          - os: ubuntu-latest
            go: '1.26.x'
          - os: windows-latest
            go: '1.26.x'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      PYTHONUTF8: '1'
      TICKFLOW_TEST_PROCESS_SCOPE: ${{ matrix.os == 'windows-latest' && 'job' || 'independent' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preserve local main reference
        run: |
          git show-ref --verify --quiet refs/heads/main
          if ($LASTEXITCODE -ne 0) { git branch main origin/main }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Modules, Python suites and restoration drill
        run: python -X utf8 tools/audit/module_sweep.py
      - name: Compile, capture, reconcile and migrate synthetic evidence
        run: python -X utf8 tools/probe/capture_task/drill.py (Join-Path $env:RUNNER_TEMP 'tickflow-offline-drill') --process-scope $env:TICKFLOW_TEST_PROCESS_SCOPE
      - name: Linux race checks
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: |
          foreach ($module in @('.', 'adapter', 'tools/probe/shinny')) {
            go -C $module test -race ./... -count=1 -timeout=10m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
